<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200" style="background-color: #F9FAFB; font-family: 'Outfit', sans-serif;">
  <!-- Header / Navigation -->
  <rect x="0" y="0" width="1000" height="70" fill="#0B6E4F"/>
  <text x="40" y="42" fill="#F9FAFB" font-size="22" font-weight="bold">Apex Drift Society</text>
  <!-- Desktop Nav Links -->
  <text x="580" y="40" fill="#F9FAFB" font-size="14" font-weight="bold">Home</text>
  <text x="650" y="40" fill="#F9FAFB" font-size="14">Cars</text>
  <text x="710" y="40" fill="#F9FAFB" font-size="14">Drivers</text>
  <text x="790" y="40" fill="#F9FAFB" font-size="14">Events</text>
  <text x="865" y="40" fill="#F9FAFB" font-size="14">Contact</text>

  <!-- Hero Section -->
  <rect x="40" y="90" width="920" height="260" fill="#111827" rx="8"/>
  <rect x="80" y="140" width="380" height="24" fill="#F9FAFB"/>
  <rect x="80" y="180" width="500" height="12" fill="#E5E7EB"/>
  <rect x="80" y="200" width="420" height="12" fill="#E5E7EB"/>
  <rect x="80" y="240" width="140" height="45" fill="#F97316" rx="4"/>
  <text x="108" y="267" fill="#F9FAFB" font-size="14" font-weight="bold">Explore Cars</text>

  <!-- Featured Cars Section (3 Columns Grid) -->
  <text x="40" y="390" fill="#111827" font-size="20" font-weight="bold">Featured Cars</text>
  
  <!-- Car 1 -->
  <rect x="40" y="410" width="286" height="240" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <rect x="55" y="425" width="256" height="110" fill="#E5E7EB" rx="4"/>
  <text x="160" y="485" fill="#9CA3AF" font-size="12">Image</text>
  <rect x="55" y="550" width="160" height="14" fill="#111827"/>
  <rect x="55" y="572" width="220" height="8" fill="#9CA3AF"/>
  <rect x="55" y="600" width="90" height="30" fill="#0B6E4F" rx="4"/>

  <!-- Car 2 -->
  <rect x="357" y="410" width="286" height="240" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <rect x="372" y="425" width="256" height="110" fill="#E5E7EB" rx="4"/>
  <text x="477" y="485" fill="#9CA3AF" font-size="12">Image</text>
  <rect x="372" y="550" width="160" height="14" fill="#111827"/>
  <rect x="372" y="572" width="220" height="8" fill="#9CA3AF"/>
  <rect x="372" y="600" width="90" height="30" fill="#0B6E4F" rx="4"/>

  <!-- Car 3 -->
  <rect x="674" y="410" width="286" height="240" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <rect x="689" y="425" width="256" height="110" fill="#E5E7EB" rx="4"/>
  <text x="794" y="485" fill="#9CA3AF" font-size="12">Image</text>
  <rect x="689" y="550" width="160" height="14" fill="#111827"/>
  <rect x="689" y="572" width="220" height="8" fill="#9CA3AF"/>
  <rect x="689" y="600" width="90" height="30" fill="#0B6E4F" rx="4"/>

  <!-- 2-Column Section: Why Drift & Featured Driver -->
  <!-- Why Drift (Column 1) -->
  <text x="40" y="690" fill="#111827" font-size="20" font-weight="bold">Why Drift?</text>
  <rect x="40" y="710" width="440" height="150" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <rect x="60" y="735" width="400" height="10" fill="#9CA3AF"/>
  <rect x="60" y="755" width="380" height="10" fill="#9CA3AF"/>
  <rect x="60" y="775" width="390" height="10" fill="#9CA3AF"/>
  <rect x="60" y="795" width="320" height="10" fill="#9CA3AF"/>

  <!-- Featured Driver (Column 2) -->
  <text x="520" y="690" fill="#111827" font-size="20" font-weight="bold">Featured Driver</text>
  <rect x="520" y="710" width="440" height="150" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="6"/>
  <circle cx="580" cy="785" r="40" fill="#E5E7EB"/>
  <text x="562" y="789" fill="#9CA3AF" font-size="11">Photo</text>
  <rect x="640" y="735" width="180" height="14" fill="#111827"/>
  <rect x="640" y="760" width="300" height="10" fill="#9CA3AF"/>
  <rect x="640" y="780" width="280" height="10" fill="#9CA3AF"/>
  <rect x="640" y="800" width="240" height="10" fill="#9CA3AF"/>

