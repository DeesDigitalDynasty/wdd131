  <text x="40" y="895" fill="#111827" font-size="20" font-weight="bold">Upcoming Event</text>
  <rect x="40" y="910" width="920" height="80" fill="#0B6E4F" rx="6"/>
  <rect x="70" y="935" width="250" height="14" fill="#F9FAFB"/>
  <rect x="70" y="955" width="380" height="10" fill="#E5E7EB"/>
  <rect x="780" y="930" width="140" height="40" fill="#F97316" rx="4"/>
  <text x="815" y="955" fill="#F9FAFB" font-size="12" font-weight="bold">Register Now</text>

  <!-- Gallery Grid (4 Column) -->
  <text x="40" y="1025" fill="#111827" font-size="20" font-weight="bold">Gallery</text>
  <rect x="40" y="1040" width="215" height="75" fill="#E5E7EB" rx="4"/>
  <rect x="275" y="1040" width="215" height="75" fill="#E5E7EB" rx="4"/>
  <rect x="510" y="1040" width="215" height="75" fill="#E5E7EB" rx="4"/>
  <rect x="745" y="1040" width="215" height="75" fill="#E5E7EB" rx="4"/>

  <!-- Footer -->
  <rect x="0" y="1140" width="1000" height="60" fill="#111827"/>
  <text x="40" y="1175" fill="#F9FAFB" font-size="14">© Apex Drift Society — BYU Pathway WDD 131</text>
  <text x="800" y="1175" fill="#F97316" font-size="14">References | Contact</text>
