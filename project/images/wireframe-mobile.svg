<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" width="380" height="720" style="background-color: #F9FAFB; font-family: 'Outfit', sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="380" height="45" fill="#0B6E4F"/>
  <text x="15" y="28" fill="#F9FAFB" font-size="15" font-weight="bold">Apex Drift Society</text>
  <!-- Hamburger Menu Icon -->
  <rect x="340" y="15" width="22" height="2.5" fill="#F9FAFB"/>
  <rect x="340" y="21" width="22" height="2.5" fill="#F9FAFB"/>
  <rect x="340" y="27" width="22" height="2.5" fill="#F9FAFB"/>

  <!-- Hero Section -->
  <rect x="15" y="55" width="350" height="110" fill="#111827" rx="6"/>
  <rect x="25" y="72" width="180" height="10" fill="#F9FAFB"/>
  <rect x="25" y="88" width="220" height="6" fill="#E5E7EB"/>
  <rect x="25" y="98" width="180" height="6" fill="#E5E7EB"/>
  <rect x="25" y="115" width="85" height="24" fill="#F97316" rx="4"/>
  <text x="38" y="131" fill="#F9FAFB" font-size="10" font-weight="bold">Explore Cars</text>

  <!-- Featured Cars Section -->
  <text x="15" y="182" fill="#111827" font-size="14" font-weight="bold">Featured Cars</text>
  <!-- Car Card 1 -->
  <rect x="15" y="192" width="350" height="65" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="5"/>
  <rect x="22" y="198" width="70" height="52" fill="#E5E7EB" rx="3"/>
  <text x="46" y="228" fill="#9CA3AF" font-size="8">Image</text>
  <rect x="102" y="202" width="110" height="8" fill="#111827"/>
  <rect x="102" y="215" width="140" height="5" fill="#9CA3AF"/>
  <rect x="102" y="224" width="120" height="5" fill="#9CA3AF"/>
  <rect x="102" y="234" width="60" height="16" fill="#0B6E4F" rx="3"/>

  <!-- Car Card 2 -->
  <rect x="15" y="263" width="350" height="65" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="5"/>
  <rect x="22" y="269" width="70" height="52" fill="#E5E7EB" rx="3"/>
  <text x="46" y="299" fill="#9CA3AF" font-size="8">Image</text>
  <rect x="102" y="273" width="110" height="8" fill="#111827"/>
  <rect x="102" y="286" width="140" height="5" fill="#9CA3AF"/>
  <rect x="102" y="295" width="120" height="5" fill="#9CA3AF"/>
  <rect x="102" y="305" width="60" height="16" fill="#0B6E4F" rx="3"/>

  <!-- Why Drift Section -->
  <text x="15" y="343" fill="#111827" font-size="14" font-weight="bold">Why Drift?</text>
  <rect x="15" y="353" width="350" height="60" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="5"/>
  <rect x="25" y="365" width="320" height="5" fill="#9CA3AF"/>
  <rect x="25" y="375" width="300" height="5" fill="#9CA3AF"/>
  <rect x="25" y="385" width="310" height="5" fill="#9CA3AF"/>
  <rect x="25" y="395" width="240" height="5" fill="#9CA3AF"/>

  <!-- Featured Driver -->
  <text x="15" y="428" fill="#111827" font-size="14" font-weight="bold">Featured Driver</text>
  <rect x="15" y="438" width="350" height="65" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" rx="5"/>
  <circle cx="48" cy="470" r="20" fill="#E5E7EB"/>
  <text x="36" y="473" fill="#9CA3AF" font-size="7">Photo</text>
  <rect x="80" y="448" width="110" height="8" fill="#111827"/>
  <rect x="80" y="460" width="220" height="5" fill="#9CA3AF"/>
  <rect x="80" y="469" width="200" height="5" fill="#9CA3AF"/>
  <rect x="80" y="478" width="180" height="5" fill="#9CA3AF"/>

  <!-- Upcoming Event -->
  <text x="15" y="518" fill="#111827" font-size="14" font-weight="bold">Upcoming Event</text>
  <rect x="15" y="528" width="350" height="45" fill="#0B6E4F" rx="5"/>
  <rect x="25" y="540" width="160" height="8" fill="#F9FAFB"/>
  <rect x="25" y="552" width="130" height="5" fill="#E5E7EB"/>

  <!-- Gallery Grid -->
  <text x="15" y="588" fill="#111827" font-size="14" font-weight="bold">Gallery</text>
  <rect x="15" y="598" width="170" height="45" fill="#E5E7EB" rx="3"/>
  <rect x="195" y="598" width="170" height="45" fill="#E5E7EB" rx="3"/>

  <!-- Footer -->
  <rect x="0" y="660" width="380" height="60" fill="#111827"/>
  <text x="110" y="685" fill="#F9FAFB" font-size="11">© Apex Drift Society</text>
  <text x="118" y="700" fill="#F97316" font-size="9">References | Contact</text>
</svg>
