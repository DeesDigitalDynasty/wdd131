<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Apex Drift Society</title>
    <meta name="description" content="Get in touch with Apex Drift Society. Join our community, submit questions, or ask about upcoming drift events.">
    <meta name="author" content="Oludayo Oluboyede">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/large.css">
    
    <!-- JavaScript Files -->
    <script src="scripts/main.js" defer></script>
    <script src="scripts/contact.js" defer></script>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-text">Apex Drift <span>Society</span></a>
            <button id="hamburger-btn" aria-label="Toggle Navigation Menu" aria-expanded="false">☰</button>
            <nav id="nav-menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="cars.html">Cars</a></li>
                    <li><a href="learn.html">Learn</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                    <li><a href="references.html">References</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="page-title">Join the Community</h1>

        <!-- Container for dynamic JavaScript submission feedback -->
        <div id="form-feedback"></div>

        <form id="contact-form" method="get" action="contact.html" class="card card-body">
            <div class="form-group">
                <label for="full-name">Full Name <span style="color: #F97316;">*</span></label>
                <input type="text" id="full-name" name="full-name" autocomplete="name" required>
            </div>

            <div class="form-group">
                <label for="user-email">Email Address <span style="color: #F97316;">*</span></label>
                <input type="email" id="user-email" name="user-email" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="fav-car-select">Favorite Drift Car <span style="color: #F97316;">*</span></label>
                <select id="fav-car-select" name="fav-car-select" required>
                    <option value="" disabled selected>Select a vehicle...</option>
                    <option value="Toyota Supra MK4">Toyota Supra MK4</option>
                    <option value="Nissan Silvia S15">Nissan Silvia S15</option>
                    <option value="Mazda RX-7 FD">Mazda RX-7 FD</option>
                    <option value="Nissan 350Z">Nissan 350Z</option>
                    <option value="Subaru BRZ">Subaru BRZ</option>
                    <option value="Ford Mustang RTR">Ford Mustang RTR</option>
                    <option value="BMW M4 Drift Car">BMW M4 Drift Car</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend><strong>Driving Experience Level</strong></legend>
                <br>
                <label for="exp-novice">
                    <input type="radio" id="exp-novice" name="experience" value="Novice" checked> Novice / Spectator
                </label><br>
                <label for="exp-intermediate">
                    <input type="radio" id="exp-intermediate" name="experience" value="Intermediate"> Intermediate (Grassroots Driver)
                </label><br>
                <label for="exp-pro">
                    <input type="radio" id="exp-pro" name="experience" value="Pro"> Advanced / Pro Driver
                </label>
            </fieldset>

            <div class="form-group">
                <label for="message">Message or Inquiry</label>
                <textarea id="message" name="message" rows="5" placeholder="Ask about events, car builds, or drifting tips..."></textarea>
            </div>

            <button type="submit" class="btn-primary">Submit Inquiry</button>
        </form>
    </main>

    <footer>

<p>

© <span id="year"></span> 🌸 Oludayo Oluboyede 🌸 Nigeria

</p>

<p id="lastModified"></p>

</footer>

<script>

document.getElementById("year").textContent =
new Date().getFullYear();

document.getElementById("lastModified").textContent =
`Last Modified: ${document.lastModified}`;

</script>
</body>
</html>
