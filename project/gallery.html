        <h1 class="page-title">Action Gallery</h1>

        <div class="gallery-grid grid-container">
            <figure class="card">
                <img src="images/hero-small.webp" alt="Drifting tandem on track" loading="lazy" width="300" height="200">
                <figcaption class="card-body">
                    <p><strong>Tandem Battle</strong></p>
                </figcaption>
            </figure>

            <figure class="card">
                <img src="images/gallery9.webp" alt="Smoking rear tires during drift" loading="lazy" width="300" height="200">

                    <p><strong> High Speed Entry</strong></p>
                </figcaption>
            </figure>

            <figure class="card">
                <img src="images/gallery7.webp" alt="Turbo charger" loading="lazy" width="300" height="200">
                <figcaption class="card-body">
                    <p><strong>Rotary Power</strong></p>
                </figcaption>

            <figure class="card">
                <img src="images/brz.webp" alt="Subaru BRZ angled in controlled slide" loading="lazy" width="300" height="200">

                    <p><strong>Subaru BRZ</strong> - Technical Precision</p>

            <figure class="card">
                <img src="images/mustang.webp" alt="Ford Mustang RTR throwing tire smoke" loading="lazy" width="300" height="200">

                    <p><strong>Ford Mustang RTR</strong> - V8 Wall Tap</p>
                </figcaption>
            </figure>

            <figure class="card">
                <img src="images/bmw-m4.webp" alt="BMW M4 drift car cornering" loading="lazy" width="300" height="200">
