<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="WDD 131 Product Review Form by Oludayo Oluboyede. Submit reviews for products.">

    <meta name="author" content="Oludayo Oluboyede">

    <title>Product Review | WDD 131 | Oludayo Oluboyede</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

<form method="get" action="review.html">

    <!-- PRODUCT -->

    <div class="form-group">

        <label for="productName">
            Product Name <span class="required">*</span>
        </label>

        <select id="productName"
                name="productName"
                required>

            <option value="" selected disabled>
                Select a Product ...
            </option>

            <!-- JavaScript will insert products here -->

        </select>

    </div>

    <!-- RATING -->

    <fieldset class="form-group">
    <legend>Overall Rating <span>*</span></legend>

    <div class="rating">

        <input type="radio" id="rating1" name="rating" value="1" required>
        <label for="rating1">☆</label>

        <input type="radio" id="rating2" name="rating" value="2">
        <label for="rating2">☆☆</label>

        <input type="radio" id="rating3" name="rating" value="3">
        <label for="rating3">☆☆☆</label>

        <input type="radio" id="rating4" name="rating" value="4">
        <label for="rating4">☆☆☆☆</label>

        <input type="radio" id="rating5" name="rating" value="5">
        <label for="rating5">☆☆☆☆☆</label>

    </div>

</fieldset>

    <!-- INSTALL DATE -->

    <div class="form-group">

        <label for="installDate">
            Date of Installation
            <span class="required">*</span>
        </label>

        <input
            type="date"
            id="installDate"
            name="installDate"
            required>

    </div>

    <!-- FEATURES -->

   <fieldset class="form-group">

    <legend>Useful Features</legend>

    <div class="checkbox-group">

        <input
            type="checkbox"
            id="durability"
            name="features"
            value="Durability">

        <label for="durability">Durability</label>

        <input
            type="checkbox"
            id="easeOfUse"
            name="features"
            value="Ease of Use">

        <label for="easeOfUse">Ease of Use</label>

        <input
            type="checkbox"
            id="performance"
            name="features"
            value="Performance">

        <label for="performance">Performance</label>

        <input
            type="checkbox"
            id="design"
            name="features"
            value="Design">

        <label for="design">Design</label>

    </div>

</fieldset>

    <!-- REVIEW -->

    <div class="form-group">

        <label for="writtenReview">

            Written Review

            <span class="optional">(Optional)</span>

        </label>

        <textarea
            id="writtenReview"
            name="writtenReview"
            rows="6"></textarea>

    </div>

    <!-- USER -->

    <div class="form-group">

        <label for="userName">

            Your Name

            <span class="optional">(Optional)</span>

        </label>

        <input
            type="text"
            id="userName"
            name="userName">

    </div>

    <!-- SUBMIT -->

    <input
        class="submit-btn"
        type="submit"
        value="Post Review">

</form>

</main>

<footer>

<p>

© <span id="currentyear"></span>

🌸 Oludayo Oluboyede 🌸 Nigeria

</p>

<p id="lastModified"></p>

</footer>

</body>
</html>
